<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC P2P AirDrop Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      pre {
        background: #0f172a;
        color: #38bdf8;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between p-6"
  >
    <header
      class="max-w-4xl mx-auto w-full border-b border-slate-800 pb-4 mb-6 flex justify-between items-center"
    >
      <div>
        <h1 class="text-xl font-black text-white">🚀 WebRTC P2P File Portal</h1>
        <p class="text-xs text-indigo-400 font-mono">
          Serverless Browser-to-Browser Data Channel
        </p>
      </div>
      <div
        id="connection-status"
        class="bg-rose-950/60 border border-rose-500/30 text-rose-400 text-xs font-mono px-3 py-1.5 rounded-full"
      >
        ● Disconnected
      </div>
    </header>

    <main
      class="max-w-4xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-6 flex-1 items-start"
    >
      <!-- Room Control & Connection Panel -->
      <section
        class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4"
      >
        <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase">
          1. Signaling Room
        </h2>

        <div class="space-y-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Room Name</label>
            <input
              type="text"
              id="room-input"
              value="test-room"
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button
              id="btn-caller"
              class="bg-indigo-600 hover:bg-indigo-500 text-white py-2 px-3 rounded-lg text-xs font-bold transition-colors shadow-lg shadow-indigo-500/10"
            >
              📞 Start as Caller
            </button>
            <button
              id="btn-callee"
              class="bg-teal-600 hover:bg-teal-500 text-white py-2 px-3 rounded-lg text-xs font-bold transition-colors shadow-lg shadow-teal-500/10"
            >
              📱 Join as Callee
            </button>
          </div>
        </div>

        <div class="border-t border-slate-800 pt-4 space-y-3">
          <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase">
            2. P2P Data Channel
          </h2>
          <div>
            <label class="text-xs text-slate-400 block mb-1"
              >Message to Peer</label
            >
            <div class="flex gap-2">
              <input
                type="text"
                id="msg-input"
                placeholder="Type direct message..."
                disabled
                class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 disabled:opacity-40"
              />
              <button
                id="btn-send"
                disabled
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors disabled:opacity-40 cursor-not-allowed"
              >
                Send
              </button>
            </div>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1"
              >File to Peer</label
            >
            <div class="flex gap-2">
              <input
                type="file"
                id="file-input"
                placeholder="Select your file..."
                disabled
                class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 disabled:opacity-40"
              />
              <button
                id="btn-file-send"
                disabled
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors disabled:opacity-40 cursor-not-allowed"
              >
                Send
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Live Event Stream Log Panel -->
      <section
        class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col h-[380px]"
      >
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase">
            💻 Network & Data Log
          </h2>
          <button
            id="btn-clear"
            class="text-xs text-slate-500 hover:text-slate-300 font-mono"
          >
            Clear
          </button>
        </div>
        <div
          id="log-box"
          class="bg-slate-950 rounded-xl p-3 font-mono text-xs overflow-y-auto flex-1 space-y-1.5 text-slate-300 border border-slate-900"
        >
          <div class="text-slate-500">
            // Initialize connection steps to view data exchange...
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
