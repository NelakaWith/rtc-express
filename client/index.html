<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'Menlo', 'monospace'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #09090b; /* zinc-950 */
        color: #e4e4e7; /* zinc-200 */
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for log box */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col p-4 md:p-8 antialiased selection:bg-zinc-800 selection:text-white">
    <div class="max-w-5xl mx-auto w-full flex-1 flex flex-col gap-8">
      
      <!-- Header -->
      <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-zinc-800/50">
        <div>
          <h1 class="text-sm font-medium text-zinc-100">WebRTC Portal</h1>
          <p class="text-xs text-zinc-500 mt-1">Direct Browser-to-Browser Data Channel</p>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-zinc-600" id="status-dot"></span>
            <span id="connection-status" class="text-[11px] font-mono text-zinc-400 uppercase tracking-widest">Disconnected</span>
          </div>
        </div>
      </header>

      <!-- Main Layout -->
      <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1">
        
        <!-- Controls Column -->
        <section class="lg:col-span-4 flex flex-col gap-8">
          
          <!-- Connection Setup -->
          <div class="flex flex-col gap-4">
            <h2 class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest">Network Setup</h2>
            <div class="flex flex-col gap-3">
              <input
                type="text"
                id="room-input"
                value="test-room"
                placeholder="Room identifier"
                class="w-full bg-transparent border border-zinc-800 rounded-md px-3 py-2 text-sm text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all"
              />
              <div class="grid grid-cols-2 gap-2">
                <button
                  id="btn-caller"
                  class="bg-zinc-100 text-zinc-900 hover:bg-white py-2 px-3 rounded-md text-xs font-medium transition-colors"
                >
                  Start as Caller
                </button>
                <button
                  id="btn-callee"
                  class="bg-zinc-800 text-zinc-200 hover:bg-zinc-700 py-2 px-3 rounded-md text-xs font-medium transition-colors border border-zinc-700/50"
                >
                  Join as Callee
                </button>
              </div>
            </div>
          </div>

          <!-- Data Transfer -->
          <div class="flex flex-col gap-4 pt-6 border-t border-zinc-800/50">
            <h2 class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest">Data Transfer</h2>
            
            <div class="flex flex-col gap-2">
              <label class="text-[11px] text-zinc-500">Message</label>
              <div class="flex gap-2">
                <input
                  type="text"
                  id="msg-input"
                  placeholder="Type message..."
                  disabled
                  class="flex-1 min-w-0 bg-transparent border border-zinc-800 rounded-md px-3 py-2 text-sm text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 disabled:opacity-50 disabled:cursor-not-allowed"
                />
                <button
                  id="btn-send"
                  disabled
                  class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-4 py-2 rounded-md text-xs font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed border border-zinc-700/50"
                >
                  Send
                </button>
              </div>
            </div>

            <div class="flex flex-col gap-2 mt-2">
              <label class="text-[11px] text-zinc-500">File</label>
              <div class="flex gap-2">
                <input
                  type="file"
                  id="file-input"
                  disabled
                  class="flex-1 min-w-0 bg-transparent border border-zinc-800 rounded-md px-3 py-1.5 text-sm text-zinc-400 file:mr-3 file:py-1 file:px-2 file:rounded file:border-0 file:text-[11px] file:bg-zinc-800 file:text-zinc-300 hover:file:bg-zinc-700 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
                />
                <button
                  id="btn-file-send"
                  disabled
                  class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-4 py-2 rounded-md text-xs font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed border border-zinc-700/50"
                >
                  Send
                </button>
              </div>
            </div>
          </div>

        </section>

        <!-- Log Column -->
        <section class="lg:col-span-8 flex flex-col h-[500px] lg:h-auto border border-zinc-800/80 rounded-lg overflow-hidden bg-[#0a0a0c]">
          <div class="flex justify-between items-center px-4 py-3 border-b border-zinc-800/80 bg-zinc-900/30">
            <span class="text-[11px] font-mono text-zinc-500 uppercase tracking-wider">Terminal</span>
            <button
              id="btn-clear"
              class="text-[10px] uppercase tracking-wider text-zinc-500 hover:text-zinc-300 font-mono transition-colors"
            >
              Clear
            </button>
          </div>
          <div
            id="log-box"
            class="p-4 font-mono text-[11px] lg:text-xs overflow-y-auto flex-1 space-y-2 text-zinc-400 leading-relaxed"
          >
            <div class="text-zinc-600">
              // Initialize connection steps to view data exchange...
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
